steps:
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/openron-api:$COMMIT_SHA', '-f', 'apps/api/Dockerfile', '.']
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/openron-api:$COMMIT_SHA']
images:
  - 'gcr.io/$PROJECT_ID/openron-api:$COMMIT_SHA'
